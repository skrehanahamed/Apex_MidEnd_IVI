name: Linux Build & Verification

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ubuntu:
    name: Build (Ubuntu 22.04 / Qt 6.6.3 GCC)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/apt.conf.d/20auto-upgrades
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libasound2-dev \
            libpulse-dev

      - name: Install Qt 6.6.3 GCC
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: gcc_64
          modules: 'qtmultimedia'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Apex IVI
        run: |
          cmake --build build --parallel

      - name: Verify Binary Output
        run: |
          test -f build/ApexIVI
          file build/ApexIVI
